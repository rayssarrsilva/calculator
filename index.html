<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <div class="extern">
        <div id="calculator">
            <div class="top-display">
                <div id="display-clear">
                    <div id="display"><span id="v1"></span><span id="op"></span><span id="v2"></span><span id="equal"></span> <br><span id="result"></span></div>
                    <div id="clear-button">
                        <button>clear</button>
                    </div>
                </div>
                <div id="operators">
                    <button>+</button>
                    <button>-</button>
                    <button>/</button>
                    <button>*</button>
                    <button>=</button>
                </div>
            </div>

            <div class="bottom-display">
                <div id="numbers">
                    <button>0</button>
                    <button>1</button>
                    <button>2</button>
                    <button>3</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>.</button>
                    <button>⌫</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
